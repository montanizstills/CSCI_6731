<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ChatApp</title>
</head>

<body>
<h1>Welcome {{ user }} to the chat!</h1>
<textarea id="global-chat-box">
</textarea>
<input
        placeholder="type a message.."
        id="user_message_input_box"
/>
</body>
<script>
    send_post_request = function (url, data) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify(data));
    };

    text_area = document.getElementById('global-chat-box');
    message_input_box = document.getElementById('user_message_input_box');

    messages = []
    message_input_box.addEventListener(
        'submit', function () {
            send_post_request('/', {message: message_input_box.value});
        messages += message_input_box.value+'\n';
    });

</script>
</html>
